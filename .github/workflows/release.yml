name: Release

# Build, test and package the sandbox binary for all three platforms
# (Windows / Linux / macOS), upload the artifacts and, on a `v*` tag push,
# create a GitHub Release with the binaries attached.
#
# Usage:
#   - Push a tag (e.g. `git tag v1.1.0 && git push origin v1.1.0`) to publish.
#   - Use the "Run workflow" button to build without publishing a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases / upload assets

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            binary: sandbox.exe
          - os: ubuntu-latest
            artifact: linux
            binary: sandbox
          - os: macos-latest
            artifact: macos
            binary: sandbox

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure
        run: cmake -S sandbox -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # SANDBOX_TEST_SKIP_DEFAULT_SHELL (set in tests/CMakeLists.txt) skips
      # the default-shell (powershell) cases on Windows, which hang under the
      # write-restricted token on GitHub runners.
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      # GNU tar (Git Bash on Windows runners) cannot write the zip format, so
      # `tar -a -c -f x.zip` silently produced a plain tar named .zip. Use
      # PowerShell's Compress-Archive for the Windows package instead.
      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/bin/sandbox.exe `
            -DestinationPath dist/fence-sandbox-windows-x64.zip

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ARCH=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          mkdir -p dist
          tar -czf "dist/fence-sandbox-${{ matrix.artifact }}-${ARCH}.tar.gz" \
            -C build/bin "${{ matrix.binary }}"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.artifact }}
          path: dist/

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releasebin
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} releasebin/ \;
          ls -la releasebin/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: releasebin/*
          generate_release_notes: true
