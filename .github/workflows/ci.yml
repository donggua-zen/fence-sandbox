name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S sandbox -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # Default-shell (powershell) cases are skipped via
      # SANDBOX_TEST_SKIP_DEFAULT_SHELL — set in tests/CMakeLists.txt —
      # because powershell.exe hangs under the write-restricted token on
      # GitHub runners. The cmd-only subset still covers the Restricted
      # Token backend that runs on these runners.
      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C Release

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure
        run: cmake -S sandbox -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
  # Pinned to the macOS 15 image generation: macos-latest is arm64 and keeps
  # migrating (macOS 26 at the time of writing), and the pin keeps the
  # toolchain deterministic and valid for the project's 11.0 deployment-target
  # floor.
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S sandbox -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # The release pipeline ships a macOS Intel (x86_64) artifact built on
  # macos-15-intel; this job keeps that target building and passing tests on
  # pull requests. It is the only place x86_64 macOS code is exercised.
  macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S sandbox -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
